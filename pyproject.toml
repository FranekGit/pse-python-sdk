[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pse-sdk"
dynamic = ["version"]
description = "Community-maintained Python SDK for the PSE (Polskie Sieci Elektroenergetyczne) public REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "FranekGit" }]
requires-python = ">=3.10"
keywords = ["pse", "energy", "electricity", "poland"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/FranekGit/pse-python-sdk"
Documentation = "https://github.com/FranekGit/pse-python-sdk/blob/main/docs/usage.md"
Changelog = "https://github.com/FranekGit/pse-python-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/FranekGit/pse-python-sdk/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.15",
    "pandas>=1.5",
]

[tool.hatch.version]
path = "src/pse_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pse_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
src = ["src", "scripts"]
extend-exclude = ["src/pse_sdk/_registry.py"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S102"]
