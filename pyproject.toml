[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pse-python-sdk"
version = "0.1.0"
description = "Python SDK for the PSE (Polskie Sieci Elektroenergetyczne) public REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = [
    "pytest",
    "responses",
    "ruff",
    "pandas>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
