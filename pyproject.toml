[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pse-sdk"
version = "1.5.1"
description = "Python SDK for the PSE (Polskie Sieci Elektroenergetyczne) public REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[dependency-groups]
dev = [
    "pytest",
    "responses",
    "ruff",
    "pandas>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pse_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
src = ["src", "scripts"]
extend-exclude = ["src/pse_sdk/_registry.py"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S102"]
