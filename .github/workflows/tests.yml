name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --locked ruff check src/ scripts/ tests/
      - run: uv run --locked ruff format --check src/ scripts/ tests/
      - run: uv run --locked scripts/gen_docs.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      # manual_test.py calls the live API on import
      - run: uv run --locked pytest --ignore=tests/manual_test.py

  test-lowest:
    # Oldest dependency versions pyproject.toml allows. pandas 1.5 predates
    # numpy 2 and breaks against it, so numpy is held below 2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.10"
      - run: echo "numpy<2" > constraints.txt
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e . --group dev -c constraints.txt
      - run: .venv/bin/python -m pytest --ignore=tests/manual_test.py
